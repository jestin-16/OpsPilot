name: OpsPilot CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - '.gitignore'
      - 'backup-*.sql'
  workflow_dispatch:

concurrency:
  group: opspilot-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test All Microservices
        working-directory: backend
        run: |
          ./mvnw -B -T 1C package

      - name: Upload Backend Jars
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: backend/*/target/*.jar
          retention-days: 1

  frontend-ci:
    name: Frontend Build, Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Code Linter & Tests
        run: |
          npm run lint
          npm test

      - name: Production Bundle Build
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

      - name: Upload Frontend Dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy-to-host:
    name: Deploy to Production Host Machine
    needs: [ backend-ci, frontend-ci ]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment Configuration
        shell: powershell
        run: |
          if (-not (Test-Path ".env")) {
            if (Test-Path "c:\Users\jesvi\OpsPilot\.env") {
              Write-Host "Copying configured host .env file..." -ForegroundColor Green
              Copy-Item "c:\Users\jesvi\OpsPilot\.env" ".env" -Force
            } elseif (Test-Path ".env.example") {
              Write-Host "Creating .env from .env.example..." -ForegroundColor Yellow
              Copy-Item ".env.example" ".env"
            } else {
              Write-Error ".env file is missing on runner host!"
              exit 1
            }
          }
          Write-Host ".env configuration confirmed." -ForegroundColor Green

      - name: Download Backend Jars
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: backend-artifacts

      - name: Distribute Backend Jars
        shell: powershell
        run: |
          Write-Host "Staging backend jars into service target folders..." -ForegroundColor Cyan
          Get-ChildItem -Path "backend-artifacts" -Recurse -Filter "*.jar" | ForEach-Object {
            if ($_.Name -match '^([a-z0-9-]+)-\d+\.\d+\.\d+') {
              $service = $Matches[1]
              $destDir = "backend\$service\target"
              if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force | Out-Null }
              Copy-Item $_.FullName "$destDir\$($_.Name)" -Force
              Write-Host "  -> Placed $($_.Name) into $destDir" -ForegroundColor Green
            }
          }

      - name: Download Frontend Dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Rebuild & Start Docker Compose Stack
        shell: powershell
        run: |
          Write-Host "Deploying Docker services with pre-built artifacts..." -ForegroundColor Cyan
          docker compose up -d --build
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Docker Compose execution failed!"
            exit 1
          }

      - name: Health Check & Smoke Verification
        shell: powershell
        run: |
          Write-Host "Verifying system readiness on port 80..." -ForegroundColor Cyan
          $maxAttempts = 15
          $attempt = 0
          $healthy = $false

          while ($attempt -lt $maxAttempts) {
            $attempt++
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:80" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                Write-Host "OpsPilot Frontend & Gateway responding with HTTP 200 OK!" -ForegroundColor Green
                break
              }
            } catch {
              Write-Host "Attempt ${attempt}/${maxAttempts} - Waiting for services to become ready..." -ForegroundColor DarkGray
            }
            Start-Sleep -Seconds 2
          }

          if (-not $healthy) {
            Write-Warning "Frontend health probe timed out. Inspecting container logs..."
            docker compose ps
            exit 1
          }

      - name: Prune Dangling Docker Images
        shell: powershell
        if: always()
        run: |
          docker image prune -f

      - name: Post Deployment Summary
        shell: powershell
        if: always()
        run: |
          $summary = @"
          ### 🚀 OpsPilot Deployment Status
          - **Commit:** `${{ github.sha }}`
          - **Branch:** `${{ github.ref_name }}`
          - **Triggered By:** `${{ github.actor }}`
          - **Target Environment:** Host Laptop (`self-hosted`)
          - **Live URL:** [https://opspilot.jestin16.dev](https://opspilot.jestin16.dev)
          - **Status:** Complete ✅
          "@
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
