name: OpsPilot CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - '.gitignore'
      - 'backup-*.sql'
  workflow_dispatch:

concurrency:
  group: opspilot-prod-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test All Microservices
        working-directory: backend
        run: |
          ./mvnw -B -T 1C test

  frontend-ci:
    name: Frontend Build, Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Code Linter & Tests
        run: |
          npm run lint
          npm test

      - name: Production Bundle Build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '275211051077-gat8a3o8evorpt66b2lana97ktvj8mko.apps.googleusercontent.com' }}
        run: npm run build

  deploy-to-host:
    name: Deploy to Production Host Machine
    needs: [ backend-ci, frontend-ci ]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify Environment Configuration
        shell: powershell
        run: |
          if (Test-Path "c:\Users\jesvi\OpsPilot\.env") {
            Write-Host "Syncing configured host .env file..." -ForegroundColor Green
            Copy-Item "c:\Users\jesvi\OpsPilot\.env" ".env" -Force
          } elseif (-not (Test-Path ".env") -and (Test-Path ".env.example")) {
            Write-Host "Creating .env from .env.example..." -ForegroundColor Yellow
            Copy-Item ".env.example" ".env"
          }
          Write-Host ".env configuration confirmed." -ForegroundColor Green

      - name: Rebuild & Start Docker Compose Stack
        shell: powershell
        run: |
          Write-Host "Inspecting changed files in commit ${{ github.sha }}..." -ForegroundColor Cyan
          $changedFiles = git diff-tree --no-commit-id --name-only -r ${{ github.sha }}
          Write-Host "Changed files:"
          $changedFiles | ForEach-Object { Write-Host " - $_" -ForegroundColor DarkGray }

          $frontendChanged = [bool]($changedFiles -match "^frontend/") -or [bool]($changedFiles -match "docker-compose\.yml")
          $backendChanged = [bool]($changedFiles -match "^backend/") -or [bool]($changedFiles -match "docker-compose\.yml")

          if ($frontendChanged) {
            Write-Host "Rebuilding frontend image..." -ForegroundColor Cyan
            docker compose build frontend
          }

          if ($backendChanged) {
            Write-Host "Rebuilding backend services with managed concurrency..." -ForegroundColor Cyan
            docker compose --parallel 2 build
          }

          if (-not $frontendChanged -and -not $backendChanged) {
            Write-Host "No service source changes detected; deploying existing stack images..." -ForegroundColor Green
          }

          Write-Host "Deploying stack via Docker Compose..." -ForegroundColor Cyan
          docker compose up -d
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Docker Compose execution failed!"
            exit 1
          }
          docker compose restart frontend | Out-Null

      - name: Health Check & Smoke Verification
        shell: powershell
        run: |
          Write-Host "Verifying system readiness on port 80 and API Gateway proxy..." -ForegroundColor Cyan
          $maxAttempts = 45
          $attempt = 0
          $healthy = $false

          while ($attempt -lt $maxAttempts) {
            $attempt++
            $feOk = $false
            $apiProxyOk = $false

            try {
              $feResponse = Invoke-WebRequest -Uri "http://127.0.0.1:80" -UseBasicParsing -TimeoutSec 3
              if ($feResponse.StatusCode -eq 200) { $feOk = $true }
            } catch {
              $feOk = $false
            }

            try {
              $apiCheck = Invoke-WebRequest -Uri "http://127.0.0.1:80/api/v1/auth/health" -UseBasicParsing -TimeoutSec 3
              if ($apiCheck.StatusCode -eq 200 -or ($apiCheck.StatusCode -ne 502 -and $apiCheck.StatusCode -ne 503 -and $apiCheck.StatusCode -ne 504)) {
                $apiProxyOk = $true
              }
            } catch {
              if ($_.Exception.Response) {
                $code = [int]$_.Exception.Response.StatusCode
                # Upstream reached (e.g. 200/401/404/500 from Spring Boot is acceptable; 502/503/504 Bad Gateway is not)
                if ($code -and $code -ne 502 -and $code -ne 503 -and $code -ne 504) {
                  $apiProxyOk = $true
                }
              }
            }

            if ($feOk -and $apiProxyOk) {
              $healthy = $true
              Write-Host "OpsPilot Frontend & Gateway responding properly!" -ForegroundColor Green
              break
            }

            Write-Host "Attempt ${attempt}/${maxAttempts} - Waiting for services (Frontend: $(if ($feOk) {'Ready'} else {'Waiting'}), Gateway: $(if ($apiProxyOk) {'Ready'} else {'Waiting'}))..." -ForegroundColor DarkGray
            Start-Sleep -Seconds 3
          }

          if (-not $healthy) {
            Write-Warning "Frontend health probe timed out. Inspecting container logs..."
            docker compose ps
            Write-Host "--- API Gateway Logs ---" -ForegroundColor Yellow
            docker compose logs --tail 30 api-gateway
            Write-Host "--- Auth Service Logs ---" -ForegroundColor Yellow
            docker compose logs --tail 30 auth-service
            exit 1
          }

      - name: Prune Dangling Docker Images
        shell: powershell
        if: success()
        run: |
          try {
            docker image prune -f
          } catch {
            Write-Warning "Docker image prune encountered a non-fatal warning: $_"
          }

      - name: Post Deployment Summary
        shell: powershell
        if: always()
        run: |
          $statusEmoji = if ('${{ job.status }}' -eq 'success') { "Complete ✅" } else { "Failed ❌" }
          $summary = @"
          ### 🚀 OpsPilot Deployment Status
          - **Commit:** `${{ github.sha }}`
          - **Branch:** `${{ github.ref_name }}`
          - **Triggered By:** `${{ github.actor }}`
          - **Target Environment:** Host Laptop (`self-hosted`)
          - **Live URL:** [https://opspilot.jestin16.dev](https://opspilot.jestin16.dev)
          - **Status:** $statusEmoji
          "@
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
