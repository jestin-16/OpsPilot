name: CI/CD Pipeline - Log Watcher Service

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/log-watcher-service/**'
      - 'backend/pom.xml'
      - 'backend/Dockerfile'
      - 'k8s/log-watcher/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/log-watcher-service/**'
      - 'backend/pom.xml'
      - 'k8s/log-watcher/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/log-watcher-service

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Parent POM
        run: |
          cd backend
          mvn clean install -N

      - name: Run Tests
        run: |
          cd backend
          mvn test -pl log-watcher-service

      - name: Package JAR
        run: |
          cd backend
          mvn package -pl log-watcher-service -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: log-watcher-service-jar
          path: backend/log-watcher-service/target/*.jar
          retention-days: 7

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: |
            SERVICE=log-watcher-service
            PORT=8084
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Kubectl Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Update Image in K8s Manifests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          sed -i "s|image: opspilot/log-watcher-service:latest|image: ${IMAGE}|g" k8s/log-watcher/deployment.yaml

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/log-watcher/rbac.yaml
          kubectl apply -f k8s/log-watcher/configmap.yaml
          kubectl apply -f k8s/log-watcher/service.yaml
          kubectl apply -f k8s/log-watcher/deployment.yaml
          kubectl apply -f k8s/log-watcher/ingress.yaml

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/opspilot-log-watcher -n default --timeout=120s
          kubectl get pods -l app=opspilot-log-watcher -n default
