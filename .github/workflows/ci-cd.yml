name: OpsPilot CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - '.gitignore'
      - 'backup-*.sql'
  workflow_dispatch:

concurrency:
  group: opspilot-prod-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test All Microservices
        working-directory: backend
        run: |
          ./mvnw -B -T 1C test

  frontend-ci:
    name: Frontend Build, Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Code Linter & Tests
        run: |
          npm run lint
          npm test

      - name: Production Bundle Build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '275211051077-gat8a3o8evorpt66b2lana97ktvj8mko.apps.googleusercontent.com' }}
        run: npm run build

  deploy-to-host:
    name: Deploy to Production Host Machine
    needs: [ backend-ci, frontend-ci ]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment Configuration
        shell: powershell
        run: |
          if (-not (Test-Path ".env")) {
            if (Test-Path "c:\Users\jesvi\OpsPilot\.env") {
              Write-Host "Copying configured host .env file..." -ForegroundColor Green
              Copy-Item "c:\Users\jesvi\OpsPilot\.env" ".env" -Force
            } elseif (Test-Path ".env.example") {
              Write-Host "Creating .env from .env.example..." -ForegroundColor Yellow
              Copy-Item ".env.example" ".env"
            } else {
              Write-Error ".env file is missing on runner host!"
              exit 1
            }
          }
          Write-Host ".env configuration confirmed." -ForegroundColor Green

      - name: Rebuild & Start Docker Compose Stack
        shell: powershell
        run: |
          Write-Host "Rebuilding and deploying Docker services with managed concurrency..." -ForegroundColor Cyan
          docker compose --parallel 2 up -d --build
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Docker Compose execution failed!"
            exit 1
          }
          # Refresh frontend container so Nginx immediately applies any proxy/DNS updates
          docker compose restart frontend | Out-Null

      - name: Health Check & Smoke Verification
        shell: powershell
        run: |
          Write-Host "Verifying system readiness on port 80 and API Gateway proxy..." -ForegroundColor Cyan
          $maxAttempts = 20
          $attempt = 0
          $healthy = $false

          while ($attempt -lt $maxAttempts) {
            $attempt++
            try {
              $feResponse = Invoke-WebRequest -Uri "http://127.0.0.1:80" -UseBasicParsing -TimeoutSec 3
              
              $apiProxyOk = $false
              try {
                $apiCheck = Invoke-WebRequest -Uri "http://127.0.0.1:80/api/v1/auth/health" -UseBasicParsing -TimeoutSec 3
                if ($apiCheck.StatusCode -ne 502 -and $apiCheck.StatusCode -ne 503 -and $apiCheck.StatusCode -ne 504) {
                  $apiProxyOk = $true
                }
              } catch {
                $code = $_.Exception.Response.StatusCode.value__
                if ($code -and $code -ne 502 -and $code -ne 503 -and $code -ne 504) {
                  $apiProxyOk = $true
                }
              }

              if ($feResponse.StatusCode -eq 200 -and $apiProxyOk) {
                $healthy = $true
                Write-Host "OpsPilot Frontend & Gateway responding properly!" -ForegroundColor Green
                break
              }
            } catch {
              Write-Host "Attempt ${attempt}/${maxAttempts} - Waiting for services to become ready..." -ForegroundColor DarkGray
            }
            Start-Sleep -Seconds 2
          }

          if (-not $healthy) {
            Write-Warning "Frontend health probe timed out. Inspecting container logs..."
            docker compose ps
            exit 1
          }

      - name: Prune Dangling Docker Images
        shell: powershell
        if: success()
        run: |
          try {
            docker image prune -f
          } catch {
            Write-Warning "Docker image prune encountered a non-fatal warning: $_"
          }

      - name: Post Deployment Summary
        shell: powershell
        if: always()
        run: |
          $statusEmoji = if ('${{ job.status }}' -eq 'success') { "Complete ✅" } else { "Failed ❌" }
          $summary = @"
          ### 🚀 OpsPilot Deployment Status
          - **Commit:** `${{ github.sha }}`
          - **Branch:** `${{ github.ref_name }}`
          - **Triggered By:** `${{ github.actor }}`
          - **Target Environment:** Host Laptop (`self-hosted`)
          - **Live URL:** [https://opspilot.jestin16.dev](https://opspilot.jestin16.dev)
          - **Status:** $statusEmoji
          "@
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
