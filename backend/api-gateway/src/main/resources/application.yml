server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**, /api/v1/auth/**
        - id: core-service
          uri: lb://core-service
          predicates:
            - Path=/api/projects/**, /api/deployments/**, /api/docker/**, /api/kubernetes/**, /api/cicd/**, /api/v1/projects/**, /api/v1/deployments/**, /api/v1/docker/**, /api/v1/kubernetes/**, /api/v1/cicd/**
        - id: observability-service
          uri: lb://observability-service
          predicates:
            - Path=/api/logs/**, /api/metrics/**, /api/notifications/**, /api/webhooks/**, /api/ai/**, /api/monitoring/**, /api/v1/logs/**, /api/v1/metrics/**, /api/v1/notifications/**, /api/v1/webhooks/**, /api/v1/ai/**, /api/v1/monitoring/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
