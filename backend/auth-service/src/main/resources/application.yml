server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opspilot}
    username: ${SPRING_DATASOURCE_USERNAME:opspilot}
    password: ${SPRING_DATASOURCE_PASSWORD:opspilot}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: true
    # Databases created before Flyway was on the classpath were built by Hibernate and have no history
    # table; they are baselined at 17 and V18 aligns them. Empty databases run every migration from V1.
    # Concurrent services are serialised by Flyway's PostgreSQL advisory lock.
    baseline-on-migrate: true
    baseline-version: 17
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Migrations own the schema; Hibernate only checks that it matches the entities.
      ddl-auto: validate
    show-sql: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

app:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  seed:
    # Creates the public demo accounts (admin@opspilot.io etc.). Local development only.
    demo-users: ${DEMO_USERS_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://service-registry:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Component details (database, mail) only for authenticated callers; this endpoint is public.
      show-details: when-authorized
      # /actuator/health/readiness backs the container healthcheck
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
