server:
  port: 8083
  servlet:
    context-path: /

spring:
  application:
    name: observability-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opspilot}
    username: ${SPRING_DATASOURCE_USERNAME:opspilot}
    password: ${SPRING_DATASOURCE_PASSWORD:opspilot}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: ***REMOVED-JWT-SECRET***
    expiration-ms: 900000
    refresh-expiration-ms: 604800000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://service-registry:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
