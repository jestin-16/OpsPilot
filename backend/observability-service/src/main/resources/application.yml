server:
  port: 8083
  servlet:
    context-path: /

spring:
  application:
    name: observability-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opspilot}
    username: ${SPRING_DATASOURCE_USERNAME:opspilot}
    password: ${SPRING_DATASOURCE_PASSWORD:opspilot}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: true
    # Databases created before Flyway was on the classpath were built by Hibernate and have no history
    # table; they are baselined at 17 and V18 aligns them. Empty databases run every migration from V1.
    # Concurrent services are serialised by Flyway's PostgreSQL advisory lock.
    baseline-on-migrate: true
    baseline-version: 17
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Migrations own the schema; Hibernate only checks that it matches the entities.
      ddl-auto: validate
    show-sql: false

app:
  seed:
    # Creates the public demo accounts (admin@opspilot.io etc.). Local development only.
    demo-users: ${DEMO_USERS_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000

kubernetes:
  master-url: ${KUBERNETES_MASTER:}
  loopback-host: ${KUBERNETES_LOOPBACK_HOST:}

monitoring:
  kubernetes:
    enabled: ${KUBERNETES_ENABLED:true}
  prometheus:
    enabled: ${PROMETHEUS_ENABLED:true}
    url: ${PROMETHEUS_URL:http://localhost:9090}
    username: ${PROMETHEUS_USERNAME:}
    password: ${PROMETHEUS_PASSWORD:}
    timeout: ${PROMETHEUS_TIMEOUT:3s}
  loki:
    enabled: ${LOKI_ENABLED:false}
    url: ${LOKI_URL:http://localhost:3100}
    username: ${LOKI_USERNAME:}
    password: ${LOKI_PASSWORD:}
    timeout: ${LOKI_TIMEOUT:3s}

ingest:
  max-body-bytes: ${INGEST_MAX_BODY_BYTES:5242880}
  max-lines: ${INGEST_MAX_LINES:50000}
  stale-after: ${INGEST_STALE_AFTER:5m}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://service-registry:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Component details (database, Kubernetes) only for authenticated callers; this endpoint is public.
      show-details: when-authorized
      # /actuator/health/readiness backs the container healthcheck
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
