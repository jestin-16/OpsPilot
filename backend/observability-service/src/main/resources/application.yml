server:
  port: 8083
  servlet:
    context-path: /

spring:
  application:
    name: observability-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opspilot}
    username: ${SPRING_DATASOURCE_USERNAME:opspilot}
    password: ${SPRING_DATASOURCE_PASSWORD:opspilot}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: ***REMOVED-JWT-SECRET***
    expiration-ms: 900000
    refresh-expiration-ms: 604800000

monitoring:
  kubernetes:
    enabled: ${KUBERNETES_ENABLED:true}
  prometheus:
    enabled: ${PROMETHEUS_ENABLED:true}
    url: ${PROMETHEUS_URL:http://localhost:9090}
    username: ${PROMETHEUS_USERNAME:}
    password: ${PROMETHEUS_PASSWORD:}
    timeout: ${PROMETHEUS_TIMEOUT:3s}
  loki:
    enabled: ${LOKI_ENABLED:false}
    url: ${LOKI_URL:http://localhost:3100}
    username: ${LOKI_USERNAME:}
    password: ${LOKI_PASSWORD:}
    timeout: ${LOKI_TIMEOUT:3s}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://service-registry:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
