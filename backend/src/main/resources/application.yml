server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: opspilot-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opspilot}
    username: ${SPRING_DATASOURCE_USERNAME:opspilot}
    password: ${SPRING_DATASOURCE_PASSWORD:opspilot}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ***REMOVED-JWT-SECRET***
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 604800000 # 7 days
