services:
  postgres:
    image: postgres:15-alpine
    container_name: opspilot-postgres
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  service-registry:
    build:
      context: ./backend
      dockerfile: service-registry/Dockerfile
    container_name: opspilot-service-registry
    ports:
      - "8761:8761"
    restart: unless-stopped

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: opspilot-auth-service
    env_file:
      - .env
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      - postgres
      - service-registry
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/opspilot
      - SPRING_DATASOURCE_USERNAME=opspilot
      - SPRING_DATASOURCE_PASSWORD=opspilot
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_AUTH=${MAIL_AUTH:-true}
      - MAIL_STARTTLS=${MAIL_STARTTLS:-true}
      - OTP_EXPIRATION_MINUTES=${OTP_EXPIRATION_MINUTES:-5}
      - OTP_MAX_ATTEMPTS=${OTP_MAX_ATTEMPTS:-5}
      - OTP_RESEND_COOLDOWN_SECONDS=${OTP_RESEND_COOLDOWN_SECONDS:-60}

  core-service:
    build:
      context: ./backend
      dockerfile: core-service/Dockerfile
    container_name: opspilot-core-service
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      - postgres
      - service-registry
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.kube:/root/.kube:ro
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/opspilot
      - SPRING_DATASOURCE_USERNAME=opspilot
      - SPRING_DATASOURCE_PASSWORD=opspilot
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - KUBERNETES_ENABLED=${KUBERNETES_ENABLED:-true}
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-true}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - PROMETHEUS_USERNAME=${PROMETHEUS_USERNAME:-}
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD:-}
      - LOKI_ENABLED=${LOKI_ENABLED:-true}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - LOKI_USERNAME=${LOKI_USERNAME:-}
      - LOKI_PASSWORD=${LOKI_PASSWORD:-}

  observability-service:
    build:
      context: ./backend
      dockerfile: observability-service/Dockerfile
    container_name: opspilot-observability-service
    ports:
      - "8083:8083"
    restart: unless-stopped
    depends_on:
      - postgres
      - service-registry
      - loki
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/opspilot
      - SPRING_DATASOURCE_USERNAME=opspilot
      - SPRING_DATASOURCE_PASSWORD=opspilot
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_ENABLED=${LOKI_ENABLED:-true}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - LOKI_USERNAME=${LOKI_USERNAME:-}
      - LOKI_PASSWORD=${LOKI_PASSWORD:-}
      - OPSPILOT_INGEST_RATE_LIMIT_CAPACITY=2
      - OPSPILOT_INGEST_RATE_LIMIT_REFILL_TOKENS=2

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: opspilot-api-gateway
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - service-registry
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  prometheus:
    image: prom/prometheus:latest
    container_name: opspilot-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Log store for the push-model Docker monitoring. Internal only: agents push through the OpsPilot
  # ingest endpoint (token-authenticated), never directly to Loki, so 3100 is intentionally not published.
  loki:
    image: grafana/loki:3.0.0
    container_name: opspilot-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: opspilot-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    depends_on:
      - prometheus
      - postgres

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: opspilot-blackbox
    ports:
      - "9115:9115"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./blackbox.yml:/config/blackbox.yml
    command: --config.file=/config/blackbox.yml
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
  loki_data:
