# Ports other than the API gateway (8080) are published on 127.0.0.1 only: they are for local debugging,
# and the services, database and dashboards should not be reachable from the rest of the network.

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:15-alpine
    container_name: opspilot-postgres
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  service-registry:
    image: opspilot-service-registry:latest
    build:
      <<: *backend-build
      args: { SERVICE: service-registry, PORT: "8761" }
    container_name: opspilot-service-registry
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx192m -XX:+UseG1GC -Djava.net.preferIPv4Stack=true
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  auth-service:
    image: opspilot-auth-service:latest
    build:
      <<: *backend-build
      args: { SERVICE: auth-service, PORT: "8081" }
    container_name: opspilot-auth-service
    env_file:
      - .env
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx256m -XX:+UseG1GC -Djava.net.preferIPv4Stack=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/opspilot
      - SPRING_DATASOURCE_USERNAME=opspilot
      - SPRING_DATASOURCE_PASSWORD=opspilot
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -base64 48)}
      - OPSPILOT_ENCRYPTION_KEY=${OPSPILOT_ENCRYPTION_KEY:?OPSPILOT_ENCRYPTION_KEY must be set in .env (openssl rand -base64 32)}
      - DEMO_USERS_ENABLED=${DEMO_USERS_ENABLED:-false}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}

  core-service:
    image: opspilot-core-service:latest
    build:
      <<: *backend-build
      args: { SERVICE: core-service, PORT: "8082" }
    container_name: opspilot-core-service
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    volumes:
      - ~/.kube:/home/opspilot/.kube:ro
    extra_hosts:
      - "kubernetes:host-gateway"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx256m -XX:+UseG1GC -Djava.net.preferIPv4Stack=true
      - KUBERNETES_LOOPBACK_HOST=${KUBERNETES_LOOPBACK_HOST:-kubernetes}
      - KUBERNETES_MASTER=${KUBERNETES_MASTER:-}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/opspilot
      - SPRING_DATASOURCE_USERNAME=opspilot
      - SPRING_DATASOURCE_PASSWORD=opspilot
      - OPSPILOT_ENCRYPTION_KEY=${OPSPILOT_ENCRYPTION_KEY:?OPSPILOT_ENCRYPTION_KEY must be set in .env (openssl rand -base64 32)}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -base64 48)}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - JENKINS_WEBHOOK_SECRET=${JENKINS_WEBHOOK_SECRET:-}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - KUBERNETES_ENABLED=${KUBERNETES_ENABLED:-true}
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-true}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - PROMETHEUS_USERNAME=${PROMETHEUS_USERNAME:-}
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD:-}
      - LOKI_ENABLED=${LOKI_ENABLED:-true}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - LOKI_USERNAME=${LOKI_USERNAME:-}
      - LOKI_PASSWORD=${LOKI_PASSWORD:-}

  observability-service:
    image: opspilot-observability-service:latest
    build:
      <<: *backend-build
      args: { SERVICE: observability-service, PORT: "8083" }
    container_name: opspilot-observability-service
    ports:
      - "127.0.0.1:8083:8083"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      loki:
        condition: service_started
    volumes:
      - ~/.kube:/home/opspilot/.kube:ro
    extra_hosts:
      - "kubernetes:host-gateway"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx256m -XX:+UseG1GC -Djava.net.preferIPv4Stack=true
      - KUBERNETES_LOOPBACK_HOST=${KUBERNETES_LOOPBACK_HOST:-kubernetes}
      - KUBERNETES_MASTER=${KUBERNETES_MASTER:-}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/opspilot
      - SPRING_DATASOURCE_USERNAME=opspilot
      - SPRING_DATASOURCE_PASSWORD=opspilot
      - OPSPILOT_ENCRYPTION_KEY=${OPSPILOT_ENCRYPTION_KEY:?OPSPILOT_ENCRYPTION_KEY must be set in .env (openssl rand -base64 32)}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -base64 48)}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - KUBERNETES_ENABLED=${KUBERNETES_ENABLED:-true}
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_ENABLED=${LOKI_ENABLED:-true}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - LOKI_USERNAME=${LOKI_USERNAME:-}
      - LOKI_PASSWORD=${LOKI_PASSWORD:-}
      - OPSPILOT_INGEST_RATE_LIMIT_CAPACITY=2
      - OPSPILOT_INGEST_RATE_LIMIT_REFILL_TOKENS=2
      - OPSPILOT_PUBLIC_URL=${OPSPILOT_PUBLIC_URL:-https://opspilot.jestin16.dev}

  log-watcher-service:
    image: opspilot-log-watcher-service:latest
    build:
      <<: *backend-build
      args: { SERVICE: log-watcher-service, PORT: "8084" }
    container_name: opspilot-log-watcher-service
    ports:
      - "127.0.0.1:8085:8084"
    restart: unless-stopped
    depends_on:
      service-registry:
        condition: service_healthy
    volumes:
      - ~/.kube:/home/opspilot/.kube:ro
    extra_hosts:
      - "kubernetes:host-gateway"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx192m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
      - KUBERNETES_ENABLED=${KUBERNETES_ENABLED:-true}
      - KUBERNETES_LOOPBACK_HOST=${KUBERNETES_LOOPBACK_HOST:-kubernetes}
      - KUBERNETES_MASTER=${KUBERNETES_MASTER:-}
      - SERVER_PORT=8084
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - WATCH_NAMESPACE=${WATCH_NAMESPACE:-default}
      - WATCH_LABEL_SELECTOR=${WATCH_LABEL_SELECTOR:-}
      - LOG_BUFFER_MAX_LINES=${LOG_BUFFER_MAX_LINES:-5000}
      - LOG_MASKING_ENABLED=${LOG_MASKING_ENABLED:-true}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -base64 48)}

  api-gateway:
    image: opspilot-api-gateway:latest
    build:
      <<: *backend-build
      args: { SERVICE: api-gateway, PORT: "8080" }
    container_name: opspilot-api-gateway
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx192m -XX:+UseG1GC -Djava.net.preferIPv4Stack=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      service-registry:
        condition: service_healthy

  frontend:
    image: opspilot-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: opspilot-frontend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - api-gateway

  # Third-party images are pinned so a rebuild can't silently pick up a new major version.
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: opspilot-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      service-registry:
        condition: service_healthy

  # Log store for the push-model Docker monitoring. Internal only: agents push through the OpsPilot
  # ingest endpoint (token-authenticated), never directly to Loki, so 3100 is intentionally not published.
  loki:
    image: grafana/loki:3.0.0
    container_name: opspilot-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    container_name: opspilot-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Only applied when the grafana_data volume is first created.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    depends_on:
      - prometheus
      - postgres

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    container_name: opspilot-blackbox
    ports:
      - "127.0.0.1:9115:9115"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./blackbox.yml:/config/blackbox.yml
    command: --config.file=/config/blackbox.yml
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
  loki_data:
