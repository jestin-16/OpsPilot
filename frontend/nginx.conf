map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static frontend assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker embedded DNS resolver (127.0.0.11) with 10s TTL to dynamically adapt when containers recreate
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_upstream http://core-service:8082;
    set $observability_upstream http://observability-service:8083;
    set $log_watcher_upstream http://log-watcher-service:8084;

    # -------------------------------------------------------------
    # 1. Real-Time Streaming & Pod Logs -> log-watcher-service
    # -------------------------------------------------------------
    # Stream pod logs: /api/logs/{namespace}/{pod} and /api/v1/logs/{namespace}/{pod}(/stream)
    location ~ ^/api/(v1/)?logs/[^/]+/[^/]+ {
        proxy_pass $log_watcher_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # Pod status, cluster health summary, log-watcher health
    location ~ ^/api/(v1/)?(pods|health/(summary|watcher)|log-watcher) {
        proxy_pass $log_watcher_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # -------------------------------------------------------------
    # 2. Telemetry, Log Query & Ingest -> observability-service
    # -------------------------------------------------------------
    # Project-specific logs & log sources: /api/(v1/)projects/{id}/logs or /log-sources
    location ~ ^/api/(v1/)?projects/[^/]+/(logs|log-sources) {
        proxy_pass $observability_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # General telemetry, metrics, AI assistant, webhooks, ingest endpoints
    location ~ ^/api/(v1/)?(logs|metrics|notifications|webhooks|ai|monitoring|log-sources|ingest|commits) {
        proxy_pass $observability_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # -------------------------------------------------------------
    # 3. Core Domain & Identity -> core-service
    # -------------------------------------------------------------
    # Default reverse proxy for all remaining /api/ requests:
    # /api/v1/auth, /api/v1/projects, /api/v1/deployments, /api/v1/kubernetes,
    # /api/v1/cicd, /api/v1/users, /api/v1/admin, /api/v1/incidents, /api/v1/alerts,
    # /api/v1/events, /api/v1/integrations, /api/v1/resources
    location /api/ {
        proxy_pass $core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }
}
