apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opspilot-log-watcher-ingress
  namespace: default
  labels:
    app.kubernetes.io/name: log-watcher-service
    app.kubernetes.io/part-of: opspilot
  annotations:
    kubernetes.io/ingress.class: "traefik"
    # Traefik (k3s default) SSE streaming configuration: disable response buffering
    traefik.ingress.kubernetes.io/buffering: "false"
    # NGINX Ingress compatibility annotations (if using ingress-nginx)
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: opspilot.local # change to per-instance domain or IP
      http:
        paths:
          - path: /api/log-watcher
            pathType: Prefix
            backend:
              service:
                name: opspilot-log-watcher
                port:
                  number: 8084
          - path: /api/pods
            pathType: Prefix
            backend:
              service:
                name: opspilot-log-watcher
                port:
                  number: 8084
          - path: /api/logs
            pathType: Prefix
            backend:
              service:
                name: opspilot-log-watcher
                port:
                  number: 8084
          - path: /api/health/summary
            pathType: Exact
            backend:
              service:
                name: opspilot-log-watcher
                port:
                  number: 8084
