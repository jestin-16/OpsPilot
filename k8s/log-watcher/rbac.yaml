apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot-log-watcher
  namespace: default
  labels:
    app.kubernetes.io/name: log-watcher-service
    app.kubernetes.io/part-of: opspilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opspilot-log-watcher-role
  namespace: default
  labels:
    app.kubernetes.io/name: log-watcher-service
    app.kubernetes.io/part-of: opspilot
rules:
  # Least privilege: pods get, list, watch
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Log streaming privilege
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Pod status and crash events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opspilot-log-watcher-rolebinding
  namespace: default
  labels:
    app.kubernetes.io/name: log-watcher-service
    app.kubernetes.io/part-of: opspilot
subjects:
  - kind: ServiceAccount
    name: opspilot-log-watcher
    namespace: default
roleRef:
  kind: Role
  name: opspilot-log-watcher-role
  apiGroup: rbac.authorization.k8s.io
