apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-showcase-app
  namespace: default
  labels:
    app: django
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
        component: web
    spec:
      containers:
        - name: web
          image: python:3.11-alpine
          command:
            - "sh"
            - "-c"
            - |
              echo "Starting Django Showcase Server on 0.0.0.0:8000..."
              i=0
              while true; do
                i=$((i+1))
                ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                if [ $((i % 7)) -eq 0 ]; then
                  echo "${ts} [WARNING] django.request: High memory pressure or deprecated query pattern in view 'dashboard_metrics'"
                elif [ $((i % 15)) -eq 0 ]; then
                  echo "${ts} [ERROR] django.request: Internal Server Error: /api/checkout (psycopg2.OperationalError: server closed connection)"
                else
                  echo "${ts} [INFO] django.server: \"GET /api/v1/health HTTP/1.1\" 200 45"
                fi
                sleep 2
              done
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: django-showcase-service
  namespace: default
  labels:
    app: django
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: django
