global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'opspilot-microservices'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    eureka_sd_configs:
      - server: 'http://host.docker.internal:8761/eureka'

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://flipkart.com
        - https://google.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
